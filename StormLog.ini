; StormLog — FaceGen storm-event logger
; Defaults match Config.cpp; comment out any key to keep its default.

[Logging]
bWriteCSV=1
bConsoleSurface=1
iFlushIntervalMs=1000
iFlushEveryNEvents=100

[Detection]
iBurstThresholdPerSecond=5
; STORM also if one burst's collapsed retry count >= this (catches storms
; that arrive as deduped same-(npc,fgp) retries, not distinct calls/sec).
iBurstStormThreshold=16
; Periodic console report of ALL actively-storming NPCs + retry counts
; (ms; 0 disables). Replaces the sporadic per-event STORM console line.
iReportIntervalMs=5000
iConsoleCooldownMs=5000
iBurstWindowMs=50
iMaxTrackedNpcs=4096

[Hooks]
bEnableLayer1=1
bEnableLayer3a=1
bEnableLayer3b=1
bEnableFlagWatch=0
